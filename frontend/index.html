<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #262b36;
        --text: #e6e8ee;
        --muted: #8b93a7;
        --user: #2563eb;
        --assistant: #2b3240;
        --accent: #3b82f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      header h1 { font-size: 16px; margin: 0; }
      header .cid { font-size: 12px; color: var(--muted); }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg { max-width: 720px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
      .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
      .msg.assistant { align-self: flex-start; background: var(--assistant); border-bottom-left-radius: 4px; }
      .msg.error { align-self: center; background: #3a1d1d; color: #ffb4b4; font-size: 13px; }
      .role { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; margin-bottom: 3px; }
      form {
        display: flex;
        gap: 10px;
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      #input {
        flex: 1;
        resize: none;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      #input:focus { outline: none; border-color: var(--accent); }
      button {
        padding: 0 20px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>Chat</h1>
      <span class="cid" id="cid">new conversation</span>
    </header>
    <div id="messages"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" autofocus></textarea>
      <button type="submit" id="send">Send</button>
    </form>

    <script>
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const cidEl = document.getElementById("cid");

      let conversationId = new URLSearchParams(location.search).get("conversation_id") || null;

      function addMessage(role, content) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        if (role !== "error") {
          const r = document.createElement("div");
          r.className = "role";
          r.textContent = role;
          el.appendChild(r);
        }
        el.appendChild(document.createTextNode(content));
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      function setConversation(id) {
        conversationId = id;
        cidEl.textContent = id;
        const url = new URL(location);
        url.searchParams.set("conversation_id", id);
        history.replaceState(null, "", url);
      }

      async function loadHistory() {
        if (!conversationId) return;
        try {
          const res = await fetch(`/conversations/${conversationId}/messages`);
          if (!res.ok) return;
          const data = await res.json();
          data.messages.forEach((m) => addMessage(m.role, m.content));
          cidEl.textContent = conversationId;
        } catch (_) {}
      }

      async function send(text) {
        addMessage("user", text);
        sendBtn.disabled = true;
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, conversation_id: conversationId }),
          });
          if (!res.ok) {
            let reason = `server responded ${res.status}`;
            try {
              const body = await res.json();
              const d = body.detail;
              reason = (d && (d.error || d)) || reason;
            } catch (_) {}
            throw new Error(reason);
          }
          const data = await res.json();
          if (!conversationId) setConversation(data.conversation_id);
          addMessage("assistant", data.reply);
        } catch (err) {
          addMessage("error", "Failed to get a reply: " + err.message);
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        send(text);
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      loadHistory();
    </script>
  </body>
</html>
